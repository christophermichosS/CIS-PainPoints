<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>CIS Process Review Workbook - Part 2</title>
        <style>
            :root {
                --app: #dfe4ea;
                --surface: #eef1f4;
                --panel: #f3f5f7;
                --card: #f7f8f9;
                --ink: #1f2d3a;
                --muted: #5b6a78;
                --line: #c5cfd9;
                --brand: #1d3f63;
                --brand2: #2b5b8a;
                --accent: #2b6cb0;
                --danger: #c62828;
                --canvas: #d6dce3;
                --phase: #e7ebef;
                --phaseHead: #3a5068;
                --phaseHeadInk: #f2f5f8;
                --edge: #6d7b89;
                --ok: #2e7d5b;
                --warn: #c27a10
            }

            body.dark {
                --app: #1b222b;
                --surface: #232c37;
                --panel: #26303b;
                --card: #2d3845;
                --ink: #e3e8ee;
                --muted: #a3b0bd;
                --line: #3b4857;
                --brand: #14273b;
                --brand2: #1e3a57;
                --accent: #5aa0e6;
                --canvas: #1e262f;
                --phase: #25303b;
                --phaseHead: #0f1a26;
                --phaseHeadInk: #e3e8ee;
                --edge: #8a99a8;
                --ok: #4cb68a;
                --warn: #e0a040
            }

            * {
                box-sizing: border-box
            }

            html,body {
                height: 100%
            }

            body {
                margin: 0;
                font: 14px/1.45 "Segoe UI",Arial,sans-serif;
                color: var(--ink);
                background: var(--app);
                display: flex;
                flex-direction: column;
                overflow: hidden
            }

            button,select,input,textarea {
                font: inherit;
                color: inherit
            }

            header {
                background: linear-gradient(120deg,var(--brand),var(--brand2));
                color: #f4f7fa;
                padding: 10px 18px;
                display: flex;
                align-items: center;
                gap: 16px
            }

            header h1 {
                font-size: 18px;
                margin: 0
            }

            header .sub {
                font-size: 12px;
                opacity: .8
            }

            .hstats {
                font-size: 12px;
                opacity: .9;
                white-space: nowrap;
                margin-left: auto
            }

            .iconbtn {
                background: rgba(255,255,255,.12);
                border: 0;
                color: #fff;
                border-radius: 6px;
                padding: 6px 9px;
                cursor: pointer;
                font-size: 13px
            }

            .toolbar {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 8px;
                padding: 8px 12px;
                background: var(--surface);
                border-bottom: 1px solid var(--line)
            }

            .btn,.toolbar input[type=date] {
                border: 1px solid var(--line);
                background: var(--card);
                border-radius: 6px;
                padding: 6px 10px;
                cursor: pointer
            }

            .btn:hover {
                border-color: var(--accent)
            }

            .btn.primary {
                background: var(--accent);
                border-color: var(--accent);
                color: #fff
            }

            .btn.danger {
                color: var(--danger)
            }

            .btn.sm {
                padding: 3px 8px;
                font-size: 12px
            }

            .btn.on {
                background: var(--accent);
                border-color: var(--accent);
                color: #fff
            }

            .btn.danger.on {
                background: var(--danger);
                border-color: var(--danger);
                color: #fff
            }

            .sep {
                width: 1px;
                height: 24px;
                background: var(--line)
            }

            .spacer {
                flex: 1
            }

            .pill {
                font-size: 12px;
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 12px;
                padding: 3px 9px;
                white-space: nowrap
            }

            .pill b {
                font-size: 13px
            }

            .pill.warn b {
                color: var(--warn)
            }

            .main {
                flex: 1;
                display: flex;
                min-height: 0
            }

            #wrap {
                flex: 1;
                overflow: auto;
                background: var(--canvas);
                padding: 16px 18px 0
            }

            nav {
                width: 240px;
                background: var(--panel);
                border-right: 1px solid var(--line);
                display: flex;
                flex-direction: column;
                transition: width .2s;
                overflow: hidden
            }

            nav.closed {
                width: 0;
                border-right: 0
            }

            nav>* {
                min-width: 240px
            }

            nav .nh {
                display: flex;
                align-items: center;
                padding: 10px 12px;
                font-weight: 600;
                border-bottom: 1px solid var(--line)
            }

            nav .nh button {
                margin-left: auto;
                border: 0;
                background: transparent;
                cursor: pointer;
                font-size: 18px;
                color: var(--muted)
            }

            .step {
                display: flex;
                gap: 10px;
                padding: 12px;
                cursor: pointer;
                border-bottom: 1px solid var(--line);
                border-left: 4px solid transparent
            }

            .step:hover {
                background: var(--card)
            }

            .step.on {
                background: var(--card);
                border-left-color: var(--accent)
            }

            .step .n {
                width: 26px;
                height: 26px;
                border-radius: 50%;
                background: var(--phaseHead);
                color: var(--phaseHeadInk);
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: 700;
                font-size: 13px;
                flex: none
            }

            .step.done .n {
                background: var(--ok)
            }

            .step b {
                display: block;
                font-size: 13px
            }

            .step small {
                color: var(--muted);
                font-size: 11.5px
            }

            aside {
                width: 380px;
                background: var(--panel);
                border-left: 1px solid var(--line);
                display: flex;
                flex-direction: column;
                min-height: 0;
                transition: width .2s;
                overflow: hidden
            }

            aside.closed {
                width: 0;
                border-left: 0
            }

            aside>* {
                min-width: 380px
            }

            .tabs {
                display: flex;
                border-bottom: 1px solid var(--line);
                align-items: center
            }

            .tabs div {
                flex: 1;
                padding: 10px 12px;
                border-bottom: 3px solid var(--accent);
                font-weight: 600
            }

            .tabs button {
                margin: 0 8px;
                border: 0;
                background: transparent;
                cursor: pointer;
                font-size: 18px;
                color: var(--muted)
            }

            .pane {
                padding: 14px 16px;
                overflow: auto;
                flex: 1
            }

            .pane h3 {
                font-size: 14px;
                margin: 16px 0 6px
            }

            h2.sec {
                font-size: 13px;
                text-transform: uppercase;
                letter-spacing: .06em;
                color: var(--muted);
                margin: 4px 0 10px
            }

            .note {
                font-size: 12px;
                color: var(--muted)
            }

            .phases {
                display: flex;
                gap: 12px;
                overflow-x: auto;
                padding: 26px 2px 12px;
                align-items: stretch
            }

            .gate {
                border-left: 3px dashed var(--danger);
                position: relative;
                margin: 0 2px
            }

            .gate i {
                position: absolute;
                top: -24px;
                left: -52px;
                width: 110px;
                text-align: center;
                font-size: 11px;
                font-weight: 700;
                font-style: normal;
                color: var(--danger)
            }

            .ph {
                min-width: 196px;
                width: 196px;
                background: var(--phase);
                border: 1px solid var(--line);
                border-radius: 8px;
                cursor: pointer;
                display: flex;
                flex-direction: column;
                overflow: hidden;
                transition: box-shadow .15s,transform .15s
            }

            .ph:hover {
                box-shadow: 0 4px 14px rgba(0,0,0,.2);
                transform: translateY(-2px)
            }

            .ph .hd {
                background: var(--phaseHead);
                color: var(--phaseHeadInk);
                padding: 8px 10px;
                font-weight: 600;
                font-size: 13px;
                text-align: center;
                min-height: 40px;
                display: flex;
                align-items: center;
                justify-content: center
            }

            .ph.pre .hd {
                background: var(--edge)
            }

            .ph .bd {
                padding: 10px
            }

            label.f {
                display: block;
                font-weight: 600;
                font-size: 12px;
                margin: 9px 0 3px;
                color: var(--muted)
            }

            .inp {
                width: 100%;
                padding: 7px 8px;
                border: 1px solid var(--line);
                border-radius: 5px;
                background: var(--card)
            }

            textarea.inp {
                min-height: 58px;
                resize: vertical
            }

            .inp:focus,.btn:focus {
                outline: 2px solid var(--accent);
                border-color: var(--accent)
            }

            .big {
                text-align: center;
                font-size: 28px;
                font-weight: 700;
                color: var(--brand2);
                line-height: 1.1;
                margin-top: 8px
            }

            body.dark .big {
                color: var(--accent)
            }

            .ph.pre .big {
                color: var(--edge)
            }

            .sm {
                font-size: 11.5px;
                color: var(--muted);
                text-align: center
            }

            .amber {
                color: var(--warn);
                font-weight: 600
            }

            .red {
                color: var(--danger);
                font-weight: 600
            }

            .green {
                color: var(--ok);
                font-weight: 600
            }

            .chk {
                display: flex;
                align-items: center;
                gap: 5px;
                font-size: 12px;
                margin-top: 5px
            }

            .panelbox {
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 8px;
                padding: 10px 12px;
                margin-bottom: 12px
            }

            .gantt {
                overflow-x: auto
            }

            .gantt svg text {
                fill: var(--ink)
            }

            .gantt svg .mut {
                fill: var(--muted)
            }

            .cards {
                list-style: none;
                margin: 0;
                padding: 0
            }

            .cards li {
                background: var(--card);
                border: 1px solid var(--line);
                border-left: 5px solid var(--warn);
                border-radius: 6px;
                padding: 9px 12px;
                margin: 8px 0;
                font-size: 13px;
                cursor: pointer;
                display: flex;
                gap: 12px;
                align-items: flex-start
            }

            .cards li:hover {
                border-color: var(--accent)
            }

            .cards li.sel {
                outline: 2px solid var(--accent)
            }

            .s3 {
                border-left-color: var(--danger)!important
            }

            .s2 {
                border-left-color: #f0a020!important
            }

            .s1 {
                border-left-color: var(--ok)!important
            }

            .cards .tm {
                width: 92px;
                flex: none
            }

            .cards .tm input {
                width: 100%;
                text-align: center;
                font-weight: 700;
                padding: 5px
            }

            .cards .tm.miss input {
                border-color: var(--warn);
                background: rgba(240,160,32,.12)
            }

            .cards .tm small {
                display: block;
                text-align: center;
                font-size: 10.5px;
                color: var(--muted)
            }

            .cards .t {
                font-weight: 600
            }

            .cards .body {
                flex: 1;
                min-width: 0
            }

            .tag {
                display: inline-block;
                font-size: 11px;
                border-radius: 10px;
                padding: 1px 7px;
                background: var(--surface);
                border: 1px solid var(--line);
                margin: 3px 4px 0 0
            }

            .row {
                display: flex;
                gap: 8px
            }

            .row>* {
                flex: 1
            }

            .hidden {
                display: none!important
            }

            .banner {
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 8px;
                padding: 10px 12px;
                margin-bottom: 10px;
                font-size: 13px;
                display: flex;
                flex-wrap: wrap;
                gap: 6px 18px;
                align-items: center
            }

            .empty {
                color: var(--muted);
                text-align: center;
                padding: 16px 6px
            }

            .ex {
                display: flex;
                gap: 8px;
                align-items: flex-start;
                background: var(--card);
                border: 1px solid var(--line);
                border-left: 5px solid var(--danger);
                border-radius: 6px;
                padding: 8px 9px;
                margin: 8px 0
            }

            .ex>div {
                flex: 1
            }

            .cm {
                display: flex;
                gap: 16px;
                background: var(--card);
                border: 1px solid var(--line);
                border-left: 5px solid var(--warn);
                border-radius: 6px;
                padding: 12px;
                margin: 10px 0
            }

            .cm.dis {
                opacity: .55
            }

            .cm .ctx {
                flex: 1;
                min-width: 0;
                font-size: 13px
            }

            .cm .frm {
                flex: 1.1;
                min-width: 0
            }

            .cm h4 {
                margin: 0 0 4px;
                font-size: 13px
            }

            .ctx .k {
                font-size: 11px;
                font-weight: 600;
                color: var(--muted);
                text-transform: uppercase;
                margin-top: 6px
            }

            .seg {
                display: flex;
                gap: 6px
            }

            .seg .btn {
                flex: 1;
                text-align: center
            }

            .pgroup {
                font-weight: 600;
                margin: 16px 0 2px;
                color: var(--muted);
                font-size: 13px;
                text-transform: uppercase;
                letter-spacing: .05em
            }

            table.reg {
                border-collapse: collapse;
                width: 100%;
                font-size: 13px;
                background: var(--card);
                border: 1px solid var(--line);
                margin-bottom: 12px
            }

            table.reg th {
                background: var(--surface);
                text-align: left;
                padding: 7px 8px;
                border-bottom: 2px solid var(--line)
            }

            table.reg td {
                padding: 7px 8px;
                border-bottom: 1px solid var(--line);
                vertical-align: middle
            }

            .rank {
                width: 30px;
                height: 30px;
                border-radius: 50%;
                background: var(--phaseHead);
                color: var(--phaseHeadInk);
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: 700
            }

            .sbar {
                height: 12px;
                background: var(--brand2);
                border-radius: 3px;
                min-width: 3px
            }

            .eff {
                font-size: 12px;
                font-weight: 600;
                padding: 2px 10px;
                border-radius: 10px;
                border: 1px solid var(--line);
                background: var(--surface)
            }

            .kpis {
                display: flex;
                gap: 12px;
                flex-wrap: wrap;
                margin-bottom: 12px
            }

            .kpi {
                flex: 1;
                min-width: 170px;
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 8px;
                padding: 10px 14px
            }

            .kpi small {
                color: var(--muted);
                display: block;
                font-size: 12px
            }

            .kpi b {
                font-size: 22px;
                color: var(--brand2)
            }

            body.dark .kpi b {
                color: var(--accent)
            }

            #navbtns {
                position: sticky;
                bottom: 0;
                display: flex;
                justify-content: flex-end;
                gap: 8px;
                padding: 12px 0;
                pointer-events: none
            }

            #navbtns .btn {
                pointer-events: auto;
                box-shadow: 0 2px 8px rgba(0,0,0,.25)
            }

            .mbg {
                position: fixed;
                inset: 0;
                background: rgba(10,20,30,.55);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 80
            }

            .mbox {
                background: var(--panel);
                border-radius: 10px;
                width: min(940px,94vw);
                max-height: 90vh;
                display: flex;
                flex-direction: column;
                box-shadow: 0 10px 40px rgba(0,0,0,.4)
            }

            .mbox .mh {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 12px 16px;
                border-bottom: 1px solid var(--line)
            }

            .mbox .mh h3 {
                margin: 0;
                font-size: 16px;
                flex: 1
            }

            .mbox .mh button.x {
                border: 0;
                background: transparent;
                font-size: 22px;
                cursor: pointer;
                color: var(--muted)
            }

            .mbox .mb {
                overflow: auto;
                padding: 4px 16px 8px
            }

            .mbox .mf {
                display: flex;
                gap: 8px;
                padding: 12px 16px;
                border-top: 1px solid var(--line);
                align-items: center
            }

            .welcome {
                max-width: 620px;
                margin: 8vh auto 0;
                text-align: center
            }

            .welcome h2 {
                font-size: 22px;
                margin: 0 0 6px
            }

            .welcome p {
                color: var(--muted);
                margin: 0 0 18px
            }

            .drop {
                border: 2px dashed var(--line);
                border-radius: 12px;
                padding: 38px 20px;
                background: var(--card);
                transition: border-color .15s,background .15s
            }

            .drop.over {
                border-color: var(--accent);
                background: var(--surface)
            }

            .drop .big2 {
                font-size: 34px;
                color: var(--edge)
            }

            .steps4 {
                display: flex;
                gap: 10px;
                margin-top: 22px;
                text-align: left
            }

            .steps4>div {
                flex: 1;
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 8px;
                padding: 10px;
                font-size: 12px;
                color: var(--muted)
            }

            .steps4 b {
                display: block;
                color: var(--ink);
                font-size: 13px
            }

            body.empty .ns,body.empty nav,body.empty aside,body.empty #navbtns {
                display: none!important
            }

            #toast {
                position: fixed;
                bottom: 18px;
                left: 50%;
                transform: translateX(-50%);
                background: #24384d;
                color: #fff;
                padding: 9px 16px;
                border-radius: 6px;
                opacity: 0;
                transition: opacity .25s;
                pointer-events: none;
                z-index: 99
            }

            #toast.show {
                opacity: 1
            }
        </style>
    </head>
    <body class="empty">
        <header>
            <div>
                <h1>CIS Process Review Workbook</h1>
                <div class="sub">Part 2 · Lead-time reduction planning</div>
            </div>
            <div class="hstats" id="hstats"></div>
            <button class="iconbtn" id="themeBtn">◐ Theme</button>
        </header>
        <div class="toolbar">
            <button class="btn ns" id="navBtn">☰ Steps</button>
            <span class="sep ns"></span>
            <button class="btn" onclick="document.getElementById('file').click()">Import workbook</button>
            <button class="btn primary ns" onclick="exportJson()">Export</button>
            <button class="btn danger ns" onclick="clearAll()">Clear &amp; start over</button>
            <span class="sep ns"></span>
            <label class="note ns">PREIMP arrival</label>
            <input class="ns" type="date" id="arrival">
            <span class="spacer"></span>
            <button class="btn ns" id="asideBtn">Hide panel ▶</button>
            <span class="pill ns">
                Post-arrival possible saving: <b id="kPost">0 d</b>
            </span>
            <span class="pill ns">
                Pre-arrival slack: <b id="kPre">0 d</b>
            </span>
            <span class="pill warn ns">
                Missing time: <b id="kMiss">0</b>
            </span>
            <input type="file" id="file" accept=".json" class="hidden">
        </div>
        <div class="main">
            <nav id="nav">
                <div class="nh">
                    Steps<button onclick="setNav(false)" title="Hide">&times;</button>
                </div>
                <div id="steps"></div>
            </nav>
            <div id="wrap">
                <div id="view"></div>
                <div id="navbtns">
                    <button class="btn" id="bBack">&larr; Back</button>
                    <button class="btn primary" id="bNext">Next &rarr;</button>
                </div>
            </div>
            <aside>
                <div class="tabs">
                    <div id="aTitle">Calendar settings</div>
                    <button onclick="setAside(false)">&times;</button>
                </div>
                <div class="pane" id="pane"></div>
            </aside>
        </div>
        <div id="modal"></div>
        <div id="toast"></div>
        <script>
            const ORDER = ["Pre-CRA Data", "After CRA Data", "APIM Production (T1FF+)", "Prep for Income Processing", "Income Processing", "Imputation Part 1", "Post Income DVs", "Weights", "Final Steps"];
            const ALIAS = {
                "During Income Processing": "Income Processing"
            };
            const CATS = ["Manual effort", "Bottleneck / wait time", "System / tool limitation", "Rework / handoff", "Data quality", "Other"];
            const STAT = ["New", "Reviewed", "Grouped", "Countermeasure defined", "Parked"];
            const DEF = {
                "APIM Production (T1FF+)": ["2026-11-16", "2026-12-14"],
                "Prep for Income Processing": ["2026-12-01", "2026-12-14"],
                "Income Processing": ["2026-12-14", "2027-02-05"],
                "Imputation Part 1": ["2026-12-14", "2027-02-05"],
                "Post Income DVs": ["2027-02-05", "2027-02-19"],
                "Weights": ["2027-02-15", "2027-02-26"],
                "Final Steps": ["2027-03-01", "2027-05-03"]
            };
            const STEPS = [["Phases & pain points", "Add times, dates, edit"], ["Countermeasures", "Propose a fix per pain point"], ["Prioritize", "Ranked by time saved and effort"], ["Before & after", "New timeline and plan"]];
            const EW = {
                S: 1,
                M: 2,
                L: 3
            }
              , EN = {
                S: "Small",
                M: "Medium",
                L: "Large"
            };
            let S = null
              , cur = null
              , sel = null
              , step = 0
              , onlyOpen = false
              , pm = null;
            const $ = id => document.getElementById(id);
            const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;"
            }[c]));
            const pd = s => {
                if (!s)
                    return null;
                const [a,b,c] = s.split("-").map(Number);
                return Date.UTC(a, b - 1, c)
            }
            ;
            const fd = t => new Date(t).toISOString().slice(0, 10);
            const DAY = 864e5;
            function toast(m) {
                const t = $("toast");
                t.textContent = m;
                t.classList.add("show");
                setTimeout( () => t.classList.remove("show"), 1800)
            }
            function isMile(it) {
                const t = it.description || "";

                    step: $("f_step").value,
                    description: $("f_desc").value,
                    cause: $("f_cause").value,
                    idea: $("f_idea").value,
                    days: $("f_days").value === "" ? null : Number($("f_days").value),
                    category: $("f_cat").value,
                    severity: Number($("f_sev").value),
                    status: $("f_stat").value,
                    phase: $("f_phase").value,
                    overlap: $("f_ov").checked,
                    notes: $("f_notes").value
                });
                save();
                toast("Saved");
                if (it.phase !== S.phases[cur].name)
                    sel = null;
                render()
            }
            function addPP() {
                const id = "n" + Date.now();
                S.items.push({
                    id,
                    phase: S.phases[cur].name,
                    step: "",
                    category: "Manual effort",
                    severity: 2,
                    status: "New",
                    description: "New pain point",
                    cause: "",
                    idea: "",
                    days: null,
                    overlap: false,
                    notes: "",
                    cmTitle: "",
                    cmDesc: "",
                    cmDays: null,
                    cmEffort: "",
                    decision: ""
                });
                sel = id;
                save();
                render()
            }
            function delPP() {
                if (!confirm("Delete this pain point?"))
                    return;
                S.items = S.items.filter(i => i.id !== sel);
                sel = null;
                save();
                render()
            }
            function openPM(id) {
                pm = id;
                modal()
            }
            function closePM() {
                pm = null;
                $("modal").innerHTML = "";
                render()
            }
            function editDetails() {
                sel = pm;
                pm = null;
                $("modal").innerHTML = "";
                setAside(true);
                render()
            }
            function mset(k, v) {
                const it = S.items.find(i => i.id === pm);
                it[k] = v;
                save();
                render()
            }
            function mbtn(k, v) {
                mset(k, v);
                modal()
            }
            function mdis() {
                const it = S.items.find(i => i.id === pm);
                it.decision = it.decision === "no" ? "" : "no";
                save();
                toast(it.decision === "no" ? "Marked not worth it" : "Restored");
                closePM()
            }
            function modal() {
                const i = S.items.find(x => x.id === pm);
                if (!i) {
                    $("modal").innerHTML = "";
                    return
                }
                const over = i.cmDays != null && i.days != null && i.cmDays > i.days;
                $("modal").innerHTML = `<div class="mbg" onclick="if(event.target===this)closePM()"><div class="mbox"><div class="mh"><h3>${esc(i.step || "Pain point")} <span class="tag">${esc(i.phase)}</span></h3><button class="x" onclick="closePM()">&times;</button></div>
 <div class="mb"><div class="cm s${i.severity} ${i.decision === "no" ? "dis" : ""}"><div class="ctx"><h4>What's happening</h4><span class="tag">${esc(i.category)}</span><span class="tag">Severity ${i.severity}</span>
 <div class="k">Pain point</div>${esc(i.description) || "-"}<div class="k">Cause</div>${esc(i.cause) || "-"}<div class="k">Idea from workshop</div>${esc(i.idea) || "-"}
 <label class="f">Lead time of this pain point (workdays)</label><input class="inp" style="width:140px" type="number" min="0" step="0.5" value="${i.days == null ? "" : i.days}" onchange="mset('days',this.value===''?null:Number(this.value))"></div>
 <div class="frm"><label class="f" style="margin-top:0">Countermeasure proposal</label><input class="inp" placeholder="Title" value="${esc(i.cmTitle)}" onchange="mset('cmTitle',this.value)">
 <textarea class="inp" style="margin-top:6px;min-height:90px" placeholder="What would we do?" onchange="mset('cmDesc',this.value)">${esc(i.cmDesc)}</textarea>
 <div class="row"><div><label class="f">Workdays we could save</label><input class="inp" type="number" min="0" step="0.5" value="${i.cmDays == null ? "" : i.cmDays}" onchange="mset('cmDays',this.value===''?null:Number(this.value));modal()">${over ? '<div class="note red">More than the pain point (' + i.days + ' d)</div>' : ""}</div>
 <div><label class="f">Effort / cost</label><div class="seg">${["S", "M", "L"].map(e => `<button class="btn ${i.cmEffort === e ? "on" : ""}" onclick="mbtn('cmEffort','${i.cmEffort === e ? "" : e}')">${EN[e]}</button>`).join("")}</div></div></div></div></div></div>
 <div class="mf"><button class="btn" onclick="editDetails()">Edit pain point details</button><span class="spacer"></span><button class="btn danger ${i.decision === "no" ? "on" : ""}" onclick="mdis()">${i.decision === "no" ? "Restore (was not worth it)" : "Not worth it"}</button><button class="btn primary" onclick="closePM()">Done</button></div></div></div>`;
            }
            function v2() {
                const groups = S.phases.map(p => ({
                    p,
                    its: S.items.filter(i => i.phase === p.name && (!onlyOpen || (!i.cmTitle && i.decision !== "no")))
                })).filter(g => g.its.length);
                const n = S.items.filter(i => i.cmTitle).length;
                $("view").innerHTML = `<div class="banner"><b>${n} of ${S.items.length}</b> pain points have a countermeasure<label class="chk" style="margin:0 0 0 auto"><input type="checkbox" ${onlyOpen ? "checked" : ""} onchange="onlyOpen=this.checked;render()"> Only show pain points still to do</label></div>
 <div class="note">One countermeasure per pain point. Time saved is in workdays of lead time. Use "Not worth it" to set one aside quickly. You can restore it later.</div>` + (groups.length ? groups.map(g => `<div class="pgroup">${esc(g.p.name)} ${g.p.pre ? "(before arrival)" : ""}</div>` + g.its.map(i => cmCard(i)).join("")).join("") : '<div class="empty">Nothing to show.</div>');
            }
            function cmCard(i) {
                const over = i.cmDays != null && i.days != null && i.cmDays > i.days;
                return `<div class="cm s${i.severity} ${i.decision === "no" ? "dis" : ""}"><div class="ctx"><h4>${esc(i.step || "(no step)")} <span class="tag">${esc(i.category)}</span></h4>
 <div class="k">Pain point</div>${esc(i.description) || "-"}<div class="k">Cause</div>${esc(i.cause) || "-"}<div class="k">Idea from workshop</div>${esc(i.idea) || "-"}
 <div class="k">Lead time of pain point</div><b>${i.days == null ? '<span class="amber">not set</span>' : i.days + " workdays"}</b></div>
 <div class="frm"><label class="f" style="margin-top:0">Countermeasure proposal</label><input class="inp" placeholder="Title" value="${esc(i.cmTitle)}" onchange="cmSet('${i.id}','cmTitle',this.value)">
 <textarea class="inp" style="margin-top:6px" placeholder="What would we do?" onchange="cmSet('${i.id}','cmDesc',this.value)">${esc(i.cmDesc)}</textarea>
 <div class="row"><div><label class="f">Workdays saved</label><input class="inp" type="number" min="0" step="0.5" value="${i.cmDays == null ? "" : i.cmDays}" onchange="cmSet('${i.id}','cmDays',this.value===''?null:Number(this.value))">${over ? '<div class="note red">More than the pain point (' + i.days + ' d)</div>' : ""}</div>
 <div><label class="f">Effort / cost</label><div class="seg">${["S", "M", "L"].map(e => `<button class="btn ${i.cmEffort === e ? "on" : ""}" onclick="cmSet('${i.id}','cmEffort','${i.cmEffort === e ? "" : e}')">${EN[e]}</button>`).join("")}</div></div></div>
 <div class="row" style="margin-top:10px"><button class="btn sm danger ${i.decision === "no" ? "on" : ""}" style="flex:none" onclick="cmSet('${i.id}','decision','${i.decision === "no" ? "" : "no"}')">${i.decision === "no" ? "Restore" : "Not worth it"}</button></div></div></div>`;
            }
            function cmSet(id, k, v) {
                const it = S.items.find(i => i.id === id);
                it[k] = v;
                save();
                const y = $("wrap").scrollTop;
                render();
                $("wrap").scrollTop = y
            }
            function ranked() {
                const c = cms().map(i => ({
                    i,
                    r: i.cmDays / EW[i.cmEffort]
                }));
                return S.sortBy === "time" ? c.sort( (a, b) => b.i.cmDays - a.i.cmDays || EW[a.i.cmEffort] - EW[b.i.cmEffort]) : c.sort( (a, b) => b.r - a.r || b.i.cmDays - a.i.cmDays)
            }
            function v3() {
                const c = ranked()
                  , mx = Math.max(1, ...c.map(x => x.i.cmDays))
                  , off = S.items.filter(i => i.decision === "no");
                $("view").innerHTML = `<div class="banner"><span>${S.sortBy === "time" ? "Ranked by <b>most time saved</b>, then lowest effort / cost." : "Ranked by <b>time saved for the effort / cost</b> (Small = 1, Medium = 2, Large = 3). A Small fix saving 4 days ranks above a Large fix saving 6."}</span>
 <span class="seg" style="margin-left:auto;min-width:300px"><button class="btn sm ${S.sortBy !== "time" ? "on" : ""}" onclick="S.sortBy='value';save();render()">Best value first</button><button class="btn sm ${S.sortBy === "time" ? "on" : ""}" onclick="S.sortBy='time';save();render()">Most time saved first</button></span></div>` + (c.length ? `<table class="reg"><tr><th>Rank</th><th>Phase</th><th>Countermeasure</th><th style="width:200px">Workdays saved</th><th>Effort / cost</th><th>Decision</th></tr>
 ${c.map( ({i}, k) => `<tr><td><div class="rank">${k + 1}</div></td><td>${esc(i.phase)}</td><td><b>${esc(i.cmTitle)}</b><div class="note">${esc(i.step)}</div></td>
 <td><div style="display:flex;align-items:center;gap:8px"><div class="sbar" style="width:${Math.round(i.cmDays / mx * 120)}px"></div><b>${i.cmDays} d</b></div></td><td><span class="eff">${EN[i.cmEffort]}</span></td>
 <td><div class="seg" style="min-width:230px"><button class="btn sm ${i.decision === "go" ? "on" : ""}" onclick="dec('${i.id}','go')">Go ahead</button><button class="btn sm" onclick="dec('${i.id}','no')">Don't go ahead</button></div></td></tr>`).join("")}</table>` : '<div class="empty">No countermeasures to rank yet. Add a title, workdays saved and effort in step 2.</div>') + (off.length ? `<h2 class="sec">Set aside as not worth it (${off.length})</h2><table class="reg">${off.map(i => `<tr><td>${esc(i.phase)}</td><td>${esc(i.cmTitle || i.step || i.description.slice(0, 60))}</td><td style="width:100px"><button class="btn sm" onclick="dec('${i.id}','')">Restore</button></td></tr>`).join("")}</table>` : "");
            }
            function dec(id, v) {
                const it = S.items.find(i => i.id === id);
                it.decision = (it.decision === v && v !== "") ? "" : v;
                save();
                render()
            }
            function scenario() {
                const rows = S.phases.map(p => {
                    const red = Math.min(S.items.filter(i => i.phase === p.name && i.decision === "go" && i.cmDays != null).reduce( (a, i) => a + i.cmDays, 0), wdOrNull(p.start, p.end) || 0);
                    return {
                        name: p.name,
                        p,
                        start: p.start,
                        end: p.end,
                        gs: p.start,
                        ge: p.end,
                        red,
                        parallel: p.parallel,
                        pre: p.pre,
                        valid: pd(p.start) != null && pd(p.end) != null && pd(p.end) >= pd(p.start)
                    }
                }
                );
                const arr = pd(S.arrival);
                let prev = null;
                const shift = {};
                rows.forEach(r => {
                    if (!r.valid)
                        return;
                    const o0 = pd(r.gs)
                      , o1 = pd(r.ge);
                    if (r.pre) {
                        r.start = r.gs;
                        r.end = fd(r.red ? stepBack(o1, r.red) : o1);
                        if (pd(r.end) < o0)
                            r.end = r.gs;
                        shift[r.name] = 0;
                        return
                    }
                    if (r.parallel)
                        return;
                    let ns = o0;
                    if (prev) {
                        ns = Math.max(arr, pd(prev.end) + (o0 - pd(prev.ge)))
                    }
                    let ne = o1 + (ns - o0);
                    if (r.red)
                        ne = stepBack(ne, r.red);
                    if (ne < ns)
                        ne = ns;
                    r.start = fd(ns);
                    r.end = fd(ne);
                    shift[r.name] = ns - o0;
                    prev = r
                }
                );
                rows.forEach(r => {
                    if (!r.valid || !r.parallel)
                        return;
                    const o0 = pd(r.gs)
                      , o1 = pd(r.ge);
                    let best = null
                      , bo = -1;
                    rows.forEach(q => {
                        if (q === r || !q.valid || q.parallel || q.pre)
                            return;
                        const ov = Math.min(o1, pd(q.ge)) - Math.max(o0, pd(q.gs));
                        if (ov > bo) {
                            bo = ov;
                            best = q
                        }
                    }
                    );
                    const sh = best ? shift[best.name] : 0;
                    let ne = o1 + sh;
                    if (r.red)
                        ne = stepBack(ne, r.red);
                    const ns = o0 + sh;
                    if (ne < ns)
                        ne = ns;
                    r.start = fd(ns);
                    r.end = fd(ne)
                }
                );
                rows.forEach(r => {
                    r.changed = r.valid && (r.start !== r.gs || r.end !== r.ge);
                    r.label = r.valid ? (wdOrNull(r.start, r.end) + " wd" + (r.red ? " · -" + r.red + " d" : "")) : ""
                }
                );
                const post = rows.filter(r => r.valid && !r.pre);
                const oEnd = post.length ? Math.max(...post.map(r => pd(r.ge))) : null
                  , nEnd = post.length ? Math.max(...post.map(r => pd(r.end))) : null;
                return {
                    rows,
                    oEnd,
                    nEnd
                };
            }
            function v4() {
                const sc = scenario()
                  , go_ = S.items.filter(i => i.decision === "go");
                const saved = sc.oEnd == null ? 0 : (sc.nEnd < sc.oEnd ? workdays(sc.nEnd + DAY, sc.oEnd) : 0)
                  , cd = sc.oEnd == null ? 0 : Math.round((sc.oEnd - sc.nEnd) / DAY);
                const all = sc.rows.filter(r => r.valid).flatMap(r => [pd(r.gs), pd(r.ge), pd(r.start), pd(r.end)])
                  , rng = all.length ? [Math.min(...all), Math.max(...all)] : null;
                const mk = (rs, g) => rs.map(r => ({
                    name: r.name,
                    start: g ? r.gs : r.start,
                    end: g ? r.ge : r.end,
                    parallel: r.parallel,
                    pre: r.pre,
                    label: g ? (wdOrNull(r.gs, r.ge) == null ? "" : wdOrNull(r.gs, r.ge) + " wd") : r.label,
                    changed: !g && r.changed,
                    gs: r.gs,
                    ge: r.ge
                }));
                $("view").innerHTML = `<div class="kpis"><div class="kpi"><small>Process end today</small><b>${sc.oEnd ? fd(sc.oEnd) : "-"}</b></div><div class="kpi"><small>Process end with countermeasures</small><b>${sc.nEnd ? fd(sc.nEnd) : "-"}</b></div><div class="kpi"><small>Lead time saved</small><b>${saved} workdays</b><small>${cd} calendar days</small></div><div class="kpi"><small>Countermeasures going ahead</small><b>${go_.length}</b></div></div>
 <h2 class="sec">Current timeline</h2><div class="panelbox gantt">${ganttSVG(mk(sc.rows, true), true, false, rng)}</div>
 <h2 class="sec">With selected countermeasures</h2><div class="panelbox gantt">${ganttSVG(mk(sc.rows, false), true, true, rng)}<div class="note">Green bars were shortened or moved earlier. Dashed outlines show the current position. Later phases keep their original gap after the previous phase and can't start before the PREIMP arrival. Parallel phases move with the phase they overlap most. Calendar shifts are estimates.</div></div>
 <h2 class="sec">Countermeasure plan</h2>
 ${go_.length ? `<table class="reg"><tr><th>Phase</th><th>Pain point</th><th>Countermeasure</th><th>Saves</th><th>Effort / cost</th></tr>${go_.map(i => `<tr><td>${esc(i.phase)}</td><td>${esc(i.step || i.description.slice(0, 60))}</td><td><b>${esc(i.cmTitle)}</b><div class="note">${esc(i.cmDesc)}</div></td><td>${i.cmDays} d</td><td>${EN[i.cmEffort]}</td></tr>`).join("")}</table>` : '<div class="empty">No countermeasures marked "Go ahead" yet. Decide in step 3.</div>'}`;
            }
            function exportJson() {
                const b = new Blob([JSON.stringify({
                    type: "cis-part2-state",
                    version: 4,
                    saved: new Date().toISOString(),
                    state: S
                }, null, 1)],{
                    type: "application/json"
                });
                const a = document.createElement("a");
                a.href = URL.createObjectURL(b);
                a.download = "CIS_Part2_" + new Date().toISOString().slice(0, 10) + ".json";
                a.click()
            }
            $("file").onchange = e => {
                readFile(e.target.files[0]);
                e.target.value = ""
            }
            ;
            $("arrival").onchange = e => {
                if (S) {
                    S.arrival = e.target.value;
                    save();
                    render()
                }
            }
            ;
            $("themeBtn").onclick = () => {
                document.body.classList.toggle("dark");
                try {
                    localStorage.setItem("cisTheme", document.body.classList.contains("dark") ? "dark" : "light")
                } catch (e) {}
            }
            ;
            try {
                if (localStorage.getItem("cisTheme") === "dark")
                    document.body.classList.add("dark");
                setAside(localStorage.getItem("cisAside") !== "0");
                setNav(localStorage.getItem("cisNav") !== "0")
            } catch (e) {}
            render();
        </script>
    </body>
</html>
